<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طريقة.زيد | NUSUK VIP Private Office</title>
<script type="importmap">
{
  "imports": {
    "@snap/camera-kit": "https://cdn.jsdelivr.net/npm/@snap/camera-kit@1.6.5/dist/index.js"
  }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#vip-canvas{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:1}
.overlay{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:20px}
.top-bar{display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
.logo{font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#D4AF37,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px}
.badge{border:1px solid #D4AF37;padding:6px 14px;border-radius:20px;font-size:12px;color:#D4AF37}
.bottom-bar{text-align:center;pointer-events:auto;padding-bottom:30px}
h1{font-size:32px;margin-bottom:8px}
h1 span{color:#D4AF37}
p{opacity:.7;font-size:14px;margin-bottom:20px}
#startBtn{pointer-events:auto;background:#D4AF37;color:#000;border:none;padding:16px 36px;border-radius:30px;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 10px 30px rgba(212,175,55,.4)}
#status{margin-top:12px;font-size:12px;opacity:.6}
</style>
</head>
<body>
<canvas id="vip-canvas"></canvas>
<div class="overlay">
  <div class="top-bar">
    <div class="logo">طريقة.زيد | TAREEQAH.ZAYD</div>
    <div class="badge">PRIVATE OFFICE • CLOCK TOWER</div>
  </div>
  <div class="bottom-bar">
    <h1>NUSUK <span>VIP</span> PRIVATE OFFICE</h1>
    <p>عدسة طريقة.زيد الرسمية - مكة المكرمة - برج الساعة</p>
    <button id="startBtn">تفعيل العدسة 👻</button>
    <div id="status">تم ربط حساب المطور بنجاح</div>
  </div>
</div>
<script type="module">
import { bootstrapCameraKit } from "@snap/camera-kit";
const apiToken = "eyJhbGciOiJIUzI1NiIsImtpZCI6IkNhbnZhc1MyU0hNQUNQcm9kIiwidHlwIjoiSldUIn0.eyJhdWQiOiJjYW52YXMtY2FudmFzYXBpIiwiaXNzIjoiY2FudmFzLXMyc3Rva2VuIiwibmJmIjoxNzgyMjUwODE0LCJzdWIiOiI5OGEzNTdiOC1iYThjLTRiMGQtYmFlMC1jMmVkNWYwYWEzZWV-UFJPRFVDVElPTn41OWMyNDkyNi1jMDRjLTRkNmYtYTE4Yi04MTBjODc0MGJiMjYifQ.sXtTVLvaUNyKp0yRD6zfmCvQmGFD3DJgXRw1J63vHZE";
const lensGroupId = "a9a7b31b-b934-4f4e-8267-92499e567f1e";
const canvas = document.getElementById('vip-canvas');
const btn = document.getElementById('startBtn');
const status = document.getElementById('status');
let session;
async function start() {
  try {
    btn.innerText = "جاري التشغيل...";
    status.innerText = "جاري تحميل Camera Kit...";
    const cameraKit = await bootstrapCameraKit({ apiToken });
    status.innerText = "جاري طلب الكاميرا...";
    session = await cameraKit.createSession({ liveRenderTarget: canvas });
    const mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
    await session.setSource(mediaStream);
    status.innerText = "جاري تحميل عدسة طريقة.زيد...";
    const { lenses } = await cameraKit.lensRepository.loadLensGroups([lensGroupId]);
    if (lenses && lenses.length > 0) {
      await session.applyLens(lenses[0]);
      status.innerText = "✅ العدسة شغالة - طريقة.زيد";
      btn.style.display = "none";
    } else {
      status.innerText = "⚠️ ما لقى العدسة - فعلها من my-lenses";
    }
    await session.play();
  } catch (e) {
    console.error(e);
    status.innerText = "خطأ: " + e.message;
    btn.innerText = "حاول مرة ثانية";
  }
}
btn.addEventListener('click', start);
</script>
</body>
</html>
