<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نسك OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'IBM Plex Sans Arabic',sans-serif}</style>
</head>
<body class="bg-[#0a0a0a] text-white text-[12px]">
<div class="flex min-h-screen">
<div class="w-[200px] border-l border-zinc-800 p-3 hidden md:block">
<div class="font-black text-[18px]">نسك OS</div>
<div class="text-[9px] text-zinc-500">70 ريال على كل VIP</div>
<div class="mt-6 p-3 bg-emerald-600 rounded"><div class="text-[9px]">ارباحك اليوم</div><div class="font-bold text-[20px]" id="p1">0 ريال</div><div class="text-[10px] mt-1" id="d1">0 معتمر</div></div>
</div>
<div class="flex-1 p-3">
<div class="grid grid-cols-3 gap-2">
<div class="bg-[#111] border border-zinc-800 rounded p-2"><div class="text-[9px] text-zinc-500">المعتمرين</div><div class="text-[18px] font-bold" id="c">0</div></div>
<div class="bg-[#111] border border-zinc-800 rounded p-2"><div class="text-[9px] text-zinc-500">ربح الجواز</div><div class="text-[18px] font-bold text-emerald-400">70</div></div>
<div class="bg-[#111] border border-zinc-800 rounded p-2"><div class="text-[9px] text-zinc-500">عمولتك</div><div class="text-[18px] font-bold text-emerald-400" id="com">0</div></div>
</div>
<div class="grid md:grid-cols-12 gap-3 mt-3">
<div class="md:col-span-7 bg-[#111] border border-zinc-800 rounded p-3">
<div class="text-[11px] font-bold">1- ارفع الجواز</div>
<label id="drop" class="mt-3 h-[140px] border border-dashed border-zinc-700 rounded flex flex-col items-center justify-center cursor-pointer">
<input id="file" type="file" accept="image/*" class="hidden">
<span id="ph" class="text-[11px] text-zinc-400">اسحب الجواز هنا</span>
<img id="prev" class="hidden w-[80px] mt-2 rounded">
</label>
<div class="mt-3 text-[11px] font-bold">2- اختر الباقة</div>
<div class="grid grid-cols-3 gap-2 mt-2">
<div onclick="sel(1)" id="k1" class="border border-zinc-800 p-2 rounded cursor-pointer"><div>اقتصادية</div><div class="font-bold">900</div><div class="text-[9px]">ربح 7</div></div>
<div onclick="sel(2)" id="k2" class="border border-zinc-800 p-2 rounded cursor-pointer"><div>الراحة</div><div class="font-bold">1300</div><div class="text-[9px]">ربح 30</div></div>
<div onclick="sel(3)" id="k3" class="border border-white bg-white text-black p-2 rounded cursor-pointer"><div>VIP</div><div class="font-bold">1900</div><div class="text-[9px]">ربح 70</div></div>
</div>
</div>
<div class="md:col-span-5 bg-[#111] border border-zinc-800 rounded p-3">
<div class="text-[11px] font-bold">مندوب واتساب</div>
<div style="display:grid;gap:10px;margin:12px 0;">
<a href="https://wa.me/966599966476" target="_blank" style="display:block;background:#25D366;color:#fff;text-align:center;padding:14px;border-radius:12px;font-weight:bold;text-decoration:none;">مندوب 1 📲 0599966476</a>
<a href="https://wa.me/966592223222" target="_blank" style="display:block;background:#fff;color:#111;text-align:center;padding:14px;border-radius:12px;font-weight:bold;text-decoration:none;border:1px solid #25D366;">مندوب 2 📲 0592223222</a>
</div>
<div id="chat" class="mt-3 space-y-2 h-[300px] overflow-auto bg-[#0a0a0a] p-2 rounded border border-zinc-900"><div class="bg-zinc-800 p-2 rounded">النظام: ارفع الجواز</div></div>
</div>
</div>
</div>
</div>
<script>
let curP=0,curC=0,selP=70;
const file=document.getElementById('file'),drop=document.getElementById('drop');
file.onchange=h;
drop.ondragover=e=>{e.preventDefault();drop.classList.add('bg-zinc-900')};
drop.ondragleave=()=>drop.classList.remove('bg-zinc-900');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('bg-zinc-900');h({target:{files:e.dataTransfer.files}})};
function sel(n){
  document.getElementById('k1').className='border border-zinc-800 p-2 rounded cursor-pointer';
  document.getElementById('k2').className='border border-zinc-800 p-2 rounded cursor-pointer';
  document.getElementById('k3').className='border border-zinc-800 p-2 rounded cursor-pointer';
  document.getElementById('k'+n).className='border border-white bg-white text-black p-2 rounded cursor-pointer';
  selP=n==1?7:n==2?30:70;
}
function h(e){
  let f=e.target.files[0];if(!f)return;
  let u=URL.createObjectURL(f);
  let p=document.getElementById('prev');
  p.src=u;p.classList.remove('hidden');
  document.getElementById('ph').classList.add('hidden');
  curC++;curP+=selP;
  document.getElementById('c').textContent=curC;
  document.getElementById('p1').textContent=curP+" ريال";
  document.getElementById('d1').textContent=curC+" معتمر";
  document.getElementById('com').textContent=curP;
  document.getElementById('chat').innerHTML+=`<div class="bg-emerald-600 p-2 rounded">تم رفع جواز - VIP ربح ${selP} ريال</div>`;
}
sel(3);
</script>
</body>
</html>
